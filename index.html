<body>
  <!--
  THESIS: The page is the next thing to do, in spoken orders. It refuses scores, rings, and a grid of equal cards.
  OWN-WORLD: Warm stone ground, one lifted rice-paper card for the current task, persimmon only on the button to press.
  STORY: Open the phone, see the meal, the walk, and lights-out, then tap once. 我 and 她 switch plans. Missed days stay unmarked.
  FIRST VIEWPORT: Date and person on one line. The current meal is the largest type, with two buttons under it. Move and sleep follow as ruled rows. Word nav sits in the thumb zone.
  FORM: Kitchen whiteboard list for one-handed phone use. No concept-seed roll; the daily job was already specified.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="sheet">
    <header id="top"></header>
    <main id="main"></main>
  </div>
  <nav>
    <div class="nav-inner">
      <button type="button" data-go="today">今天</button>
      <button type="button" data-go="menu">菜单</button>
      <button type="button" data-go="move">动作</button>
      <button type="button" data-go="week">这周</button>
    </div>
  </nav>
  <script src="plan.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
